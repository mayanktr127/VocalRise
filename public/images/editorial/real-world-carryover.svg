<svg width="560" height="380" viewBox="0 0 560 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="carryover-title carryover-desc">
  <title id="carryover-title">Everyday Communication Carryover Goals</title>
  <desc id="carryover-desc">Three real-world communication contexts: workplace meetings, telephone calls, and everyday social interactions.</desc>
  <defs>
    <linearGradient id="carryBg" x1="0" y1="0" x2="560" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7F9F8" />
      <stop offset="100%" stop-color="#E7EFF2" />
    </linearGradient>
  </defs>

  <rect width="560" height="380" rx="28" fill="url(#carryBg)" />
  <rect x="1" y="1" width="558" height="378" rx="27" stroke="#D5E1E6" />

  <!-- 3 Real-World Speaking Scenarios: Workplace Standup, Phone Call, Social Cafe -->
  <g transform="translate(40, 50)">
    <rect width="145" height="280" rx="18" fill="#FFFFFF" stroke="#D5E1E6" />
    <circle cx="72" cy="60" r="26" fill="#E7EFF2" />
    <rect x="62" y="50" width="20" height="20" rx="4" fill="#315F78" />
    <text x="72" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#243746" text-anchor="middle">Work Standup</text>
    <text x="72" y="142" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#6B7C85" text-anchor="middle">Voluntary pausing</text>
    <text x="72" y="158" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#6B7C85" text-anchor="middle">in group meetings</text>
    <rect x="25" y="210" width="95" height="28" rx="14" fill="#E7EFF2" />
    <text x="72" y="228" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#315F78" text-anchor="middle">Participation</text>
  </g>

  <g transform="translate(205, 50)">
    <rect width="150" height="280" rx="18" fill="#FFFFFF" stroke="#315F78" stroke-width="1.5" />
    <circle cx="75" cy="60" r="26" fill="#315F78" />
    <path d="M 66 52 C 66 52, 70 56, 75 60 C 80 64, 84 64, 84 64" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <text x="75" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#243746" text-anchor="middle">Telephone Calls</text>
    <text x="75" y="142" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#6B7C85" text-anchor="middle">Desensitization to</text>
    <text x="75" y="158" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#6B7C85" text-anchor="middle">voice-only pressure</text>
    <rect x="25" y="210" width="100" height="28" rx="14" fill="#315F78" />
    <text x="75" y="228" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Confidence Goal</text>
  </g>

  <g transform="translate(375, 50)">
    <rect width="145" height="280" rx="18" fill="#FFFFFF" stroke="#D5E1E6" />
    <circle cx="72" cy="60" r="26" fill="#E7EFF2" />
    <circle cx="72" cy="60" r="10" fill="#C9826D" />
    <text x="72" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#243746" text-anchor="middle">Everyday Life</text>
    <text x="72" y="142" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#6B7C85" text-anchor="middle">Ordering food without</text>
    <text x="72" y="158" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#6B7C85" text-anchor="middle">word substitutions</text>
    <rect x="25" y="210" width="95" height="28" rx="14" fill="#E7EFF2" />
    <text x="72" y="228" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#C9826D" text-anchor="middle">Authenticity</text>
  </g>
</svg>
