<svg width="560" height="380" viewBox="0 0 560 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="therapist-consult-title therapist-consult-desc">
  <title id="therapist-consult-title">Between-Session Clinician Collaboration Model</title>
  <desc id="therapist-consult-desc">Illustration depicting asynchronous audio review with explicit client permission and between-session clinical guidance.</desc>
  <defs>
    <linearGradient id="consultBg" x1="0" y1="0" x2="560" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E7EFF2" />
    </linearGradient>
    <filter id="consultShadow" x="20" y="20" width="520" height="340" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#243746" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="560" height="380" rx="28" fill="url(#consultBg)" />
  <rect x="1" y="1" width="558" height="378" rx="27" stroke="#D5E1E6" />

  <!-- Between-Session Collaboration Bridge Visual -->
  <!-- Left Side: Patient Home Practice Box -->
  <g transform="translate(60, 70)" filter="url(#consultShadow)">
    <rect width="180" height="240" rx="20" fill="#FFFFFF" stroke="#D5E1E6" />
    <rect x="20" y="24" width="40" height="8" rx="4" fill="#E7EFF2" />
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#243746">Home Practice</text>
    <text x="20" y="74" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#6B7C85">Daily 10-min micro-drills</text>

    <!-- Mini waveform indicator -->
    <rect x="20" y="100" width="140" height="48" rx="12" fill="#F7F9F8" stroke="#E7EFF2" />
    <path d="M 32 124 L 32 124 M 40 118 L 40 130 M 48 112 L 48 136 M 56 120 L 56 128 M 64 114 L 64 134 M 72 122 L 72 126" stroke="#315F78" stroke-width="2.5" stroke-linecap="round" />
    
    <rect x="20" y="165" width="140" height="32" rx="10" fill="#315F78" />
    <text x="90" y="185" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Recorded Session</text>
    <rect x="20" y="205" width="140" height="16" rx="6" fill="#ECFDF5" />
    <text x="90" y="217" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#047857" text-anchor="middle">✓ Shared with Permission</text>
  </g>

  <!-- Connecting Data/Permission Bridge -->
  <g transform="translate(240, 180)">
    <line x1="10" y1="0" x2="70" y2="0" stroke="#A9C4D1" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="40" cy="0" r="14" fill="#FFFFFF" stroke="#315F78" stroke-width="2" />
    <path d="M 37 -3 L 43 0 L 37 3" fill="none" stroke="#315F78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right Side: Clinician Review Box -->
  <g transform="translate(320, 70)" filter="url(#consultShadow)">
    <rect width="180" height="240" rx="20" fill="#FFFFFF" stroke="#D5E1E6" />
    <rect x="20" y="24" width="40" height="8" rx="4" fill="#E7EFF2" />
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#243746">Clinician Review</text>
    <text x="20" y="74" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#6B7C85">Between-session feedback</text>

    <!-- Notes box -->
    <rect x="20" y="100" width="140" height="75" rx="12" fill="#F0F5F7" stroke="#E7EFF2" />
    <text x="32" y="122" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#243746">Clinician Notes:</text>
    <text x="32" y="140" font-family="system-ui, sans-serif" font-size="9" font-weight="400" fill="#4B555A">&ldquo;Notice the reduced</text>
    <text x="32" y="154" font-family="system-ui, sans-serif" font-size="9" font-weight="400" fill="#4B555A">laryngeal tension!&rdquo;</text>

    <rect x="20" y="190" width="140" height="32" rx="10" fill="#E7EFF2" stroke="#A9C4D1" />
    <text x="90" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#243746" text-anchor="middle">Prescribe Next Drill</text>
  </g>
</svg>
