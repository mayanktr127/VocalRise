<svg width="480" height="320" viewBox="0 0 480 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="articulation-support-title articulation-support-desc">
  <title id="articulation-support-title">Articulation and Lisping Support Pathway</title>
  <desc id="articulation-support-desc">Acoustic resonance wave illustration showing central airflow focus and systematic sound ladders.</desc>
  <defs>
    <linearGradient id="articCardBg" x1="0" y1="0" x2="480" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7F9F8" />
      <stop offset="100%" stop-color="#E7EFF2" />
    </linearGradient>
    <linearGradient id="soundFocus" x1="120" y1="80" x2="360" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#315F78" />
      <stop offset="100%" stop-color="#243746" />
    </linearGradient>
  </defs>

  <rect width="480" height="320" rx="24" fill="url(#articCardBg)" />
  <rect x="1" y="1" width="478" height="318" rx="23" stroke="#D5E1E6" />

  <!-- Acoustic Central Airflow Channel -->
  <path d="M 80 160 L 160 160 C 200 160, 220 120, 240 120 C 260 120, 280 160, 320 160 L 400 160" 
        stroke="url(#soundFocus)" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Acoustic Frequency Concentric Rings -->
  <ellipse cx="240" cy="160" rx="50" ry="70" stroke="#A9C4D1" stroke-width="1.5" stroke-dasharray="3 5" fill="none" />
  <ellipse cx="240" cy="160" rx="90" ry="95" stroke="#A9C4D1" stroke-width="1.2" stroke-dasharray="4 8" fill="none" opacity="0.6" />
  <ellipse cx="240" cy="160" rx="140" ry="120" stroke="#315F78" stroke-width="0.8" stroke-dasharray="2 10" fill="none" opacity="0.3" />

  <!-- Target Contact / Placement Nodes -->
  <g transform="translate(180, 160)">
    <rect x="-35" y="-14" width="70" height="28" rx="14" fill="#FFFFFF" stroke="#315F78" stroke-width="1.5" />
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#315F78" text-anchor="middle">/s/ • /z/</text>
  </g>

  <g transform="translate(300, 160)">
    <rect x="-35" y="-14" width="70" height="28" rx="14" fill="#FFFFFF" stroke="#315F78" stroke-width="1.5" />
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#315F78" text-anchor="middle">/r/ Precision</text>
  </g>

  <!-- Placement hierarchy badge -->
  <g transform="translate(240, 245)">
    <rect x="-100" y="-14" width="200" height="28" rx="14" fill="#FFFFFF" stroke="#D5E1E6" />
    <circle cx="-82" cy="0" r="4" fill="#315F78" />
    <text x="-68" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#243746">Systematic Drill Ladder</text>
  </g>
</svg>
