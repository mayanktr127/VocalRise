<svg width="480" height="320" viewBox="0 0 480 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stammering-support-title stammering-support-desc">
  <title id="stammering-support-title">Stammering and Fluency Support Pathway</title>
  <desc id="stammering-support-desc">Continuous airflow wave depicting gentle vocal onsets, voicing continuity, and communicative freedom.</desc>
  <defs>
    <linearGradient id="stammeringCardBg" x1="0" y1="0" x2="480" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E7EFF2" />
      <stop offset="100%" stop-color="#F7F9F8" />
    </linearGradient>
    <linearGradient id="breathFlow" x1="60" y1="160" x2="420" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#315F78" />
      <stop offset="50%" stop-color="#83B5CC" />
      <stop offset="100%" stop-color="#C9826D" />
    </linearGradient>
  </defs>

  <rect width="480" height="320" rx="24" fill="url(#stammeringCardBg)" />
  <rect x="1" y="1" width="478" height="318" rx="23" stroke="#D5E1E6" />

  <!-- Smooth continuous speech flow wave -->
  <path d="M 60 160 C 110 110, 150 210, 200 160 C 250 110, 290 210, 340 160 C 380 120, 400 180, 420 160" 
        stroke="url(#breathFlow)" stroke-width="4" stroke-linecap="round" fill="none" />
  
  <!-- Subtle harmonic under-waves -->
  <path d="M 60 160 C 110 135, 150 185, 200 160 C 250 135, 290 185, 340 160 C 380 140, 400 170, 420 160" 
        stroke="#A9C4D1" stroke-width="1.5" stroke-dasharray="4 6" fill="none" opacity="0.6" />

  <!-- Flow Pacing Nodes -->
  <g transform="translate(130, 135)">
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#315F78" stroke-width="3" />
    <circle cx="0" cy="0" r="5" fill="#315F78" />
    <rect x="-45" y="24" width="90" height="24" rx="12" fill="#FFFFFF" stroke="#D5E1E6" />
    <text x="0" y="40" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#243746" text-anchor="middle">Gentle Onset</text>
  </g>

  <g transform="translate(270, 185)">
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#83B5CC" stroke-width="3" />
    <circle cx="0" cy="0" r="5" fill="#83B5CC" />
    <rect x="-55" y="-40" width="110" height="24" rx="12" fill="#FFFFFF" stroke="#D5E1E6" />
    <text x="0" y="-24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#243746" text-anchor="middle">Continuous Voicing</text>
  </g>

  <g transform="translate(390, 140)">
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#C9826D" stroke-width="3" />
    <circle cx="0" cy="0" r="5" fill="#C9826D" />
    <rect x="-50" y="24" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#D5E1E6" />
    <text x="0" y="40" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#243746" text-anchor="middle">Ease & Freedom</text>
  </g>
</svg>
